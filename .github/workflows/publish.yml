name: Publish package
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  publish-npm:
    name: Publish package on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Configure git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: |
          npm install
      - name: Lint and unit tests
        run: |
          npx standard src/ tests/
          npm test
      - name: Bump version based on commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [[ -z $(git describe --tags --abbrev=0 2>/dev/null) ]]; then
            echo "No tags found. This might be the first release."
            echo "Using current version from package.json: $CURRENT_VERSION"
            NEW_VERSION=$CURRENT_VERSION
          else
            if [[ $COMMIT_MSG == *"BREAKING CHANGE"* || $COMMIT_MSG == *"major"* ]]; then
              echo "Major version bump"
              NEW_VERSION=$(npm version major --no-git-tag-version)
            elif [[ $COMMIT_MSG == *"minor"* ]]; then
              echo "Minor version bump"
              NEW_VERSION=$(npm version minor --no-git-tag-version)
            else
              echo "Patch version bump"
              NEW_VERSION=$(npm version patch --no-git-tag-version)
            fi
            NEW_VERSION=${NEW_VERSION#v}
          fi

          echo "Version to be used: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
      - name: Build project
        run: |
          npm run build
      - name: Generate changelog
        run: |
          parse_date () {
            git log -1 --pretty=format:'%ad' --date=short "$1"
          }
          create_tag () {
            git tag "$1"
          }
          get_package_version () {
            node -p "require('./package.json').version"
          }

          new_version="$(get_package_version)"

          if [[ -f CHANGELOG.md ]]; then
            existing_changelog=$(sed '1d' CHANGELOG.md)
          else
            existing_changelog=""
          fi

          changelog_content="# CHANGELOG\n\n"

          if [[ -z $(git tag | tail -1) ]]; then
            first_tag="$new_version"
            create_tag "$first_tag"
            tag_date=$(parse_date "${first_tag}")
            changelog_content+="## ${first_tag} (${tag_date})\n\n"
            changelog_content+=$(git log --pretty=format:"* %s by %an [View](https://github.com/${GITHUB_REPOSITORY}/commit/%H)" --reverse | grep -v 'Merge\|skip]')
            changelog_content+="\n\n"
          else
            previous_tag=$(git describe --tags --abbrev=0)
            create_tag "$new_version"
            changelog_content+="## ${new_version} ($(date +'%Y-%m-%d'))\n\n"
            changelog_content+=$(git log ${previous_tag}..HEAD --pretty=format:"* %s by %an [View](https://github.com/${GITHUB_REPOSITORY}/commit/%H)" --reverse | grep -v 'Merge\|skip]')
            changelog_content+="\n\n"
          fi

          echo -e "${changelog_content}${existing_changelog}" > CHANGELOG.md
      - name: Publish package to npm
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
      - name: Create and push tag
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
      - name: Commit package files
        run: |
          git add package.json CHANGELOG.md

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "[ci skip]: update package files and changelog" --no-verify
          )

          git push origin HEAD
